# Overrides the config.ini shipped in the kindle-hid-passthrough release.
# build.sh lays the release down first and then copies this over it.
#
# Two things need changing for karyll, and both are load-bearing.

[paths]
# The release hardcodes /mnt/us/kindle_hid_passthrough here, and config.py
# prefers an explicit value over the base path — so KINDLE_HID_BASE alone does
# NOT relocate these. Without this override the stack would keep its paired
# devices and link keys outside the extension, and uninstalling karyll would
# leave them behind.
cache_dir = /mnt/us/extensions/karyll/hid/cache
devices_config = /mnt/us/extensions/karyll/hid/devices.conf

[connection]
reconnect_delay = 5
hci_reset_timeout = 10
connect_timeout = 30
transport_timeout = 30

[transport]
# hci_transport = file:/dev/stpbt

[device]
name = Kindle-HID
address = F0:F0:F0:F0:F0:F0

[protocol]
# Per-device protocol comes from devices.conf; this is only the fallback.
type = classic

[logging]
# The release logs to /var/log, which is tmpfs on this device — a reboot
# destroys it, which is exactly what happened the last time the framework
# crashed and the log was wanted. Keep it on the user partition instead.
log_file = /mnt/us/extensions/karyll/var/hid.log
