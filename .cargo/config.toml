# Two targets, because the Kindles run two ARM ABIs: a binary built for the
# wrong one names a loader the device does not have and never starts.
# `build.sh` builds both, and the launcher picks by the loader each one names.

# `rust-lld` because Apple's `ld` cannot link ELF. The pure-Rust cross path
# holds only while no crate in the graph has a C build script. The sysroot is
# `build.sh`'s: it has to be assembled before it can be pointed at.

# Hard float: the Scribe and the Colorsoft.
[target.armv7-unknown-linux-gnueabihf]
linker = "rust-lld"

# Soft float: the Oasis 2, and every Kindle whose `/lib` has `ld-linux.so.3`
# rather than `ld-linux-armhf.so.3`.
[target.armv7-unknown-linux-gnueabi]
linker = "rust-lld"
