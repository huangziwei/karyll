# Publish a release on GitHub, get the install tree attached to it.
#
#   Releases -> Draft a new release -> tag v0.1.0 -> Publish
#
# **Publishing is what starts this, not the tag.** The release is written by
# hand and this only ever adds files to one that already exists, so a tag pushed
# on its own builds nothing and a draft waits until it is published. Assets are
# replaced rather than added to, which is what makes a failed run safe to re-run
# from the Actions tab without touching the release.
#
# The tag has to match the workspace version in Cargo.toml; the job stops if it
# does not, because the version is compiled into the binary and a release whose
# name disagrees with what it reports is unreadable from a device log.
#
# Nothing about the build is CI-specific. build.sh fetches both float ABIs'
# glibc and the Bluetooth stack itself, each pinned by URL and sha256, so a
# runner and a workstation assemble the same tree. The zip is not part of that tree and is
# made here alone: locally the tree is what gets dragged to the device, and an
# archive of it would be a build product nobody opens.

name: Release

on:
    release:
        types: [published]
    # For a dry run on a branch: builds, and attaches nothing to anything.
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Check the tag against Cargo.toml
              if: github.event_name == 'release'
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  crate=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
                  if [ "$crate" != "${TAG#v}" ]; then
                    echo "error: release $TAG does not match Cargo.toml $crate" >&2
                    exit 1
                  fi
                  echo "version $crate"

            # Both float ABIs, because both binaries ship: a Kindle has the loader for
            # one of them and not the other, and build.sh stops before it starts if
            # either target is missing.
            - name: Install the cross targets
              run: |
                  rustup target add \
                    armv7-unknown-linux-gnueabihf \
                    armv7-unknown-linux-gnueabi

            # build.sh holds every URL and sha256 the paths below are fetched from.
            - name: Restore the fetched sysroots, Bluetooth stack and faces
              uses: actions/cache@v4
              with:
                  path: |
                      deploy/sysroot-armhf
                      deploy/sysroot-armel
                      deploy/hid
                      deploy/fonts
                  key: deploy-${{ runner.os }}-${{ hashFiles('build.sh') }}

            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

            - name: Format, lint, test
              run: |
                  cargo fmt --all --check
                  cargo clippy --workspace --all-targets -- -D warnings
                  cargo test --workspace

            - name: Build the install tree
              env:
                  # Stamps the tag into the binary, so `karyll <version> build <stamp>`
                  # in the device log names the release someone installed. The branch
                  # name stands in for it on a dry run, where there is no tag.
                  KARYLL_BUILD: ${{ github.event.release.tag_name || github.ref_name }}
              run: ./build.sh

            - name: Package
              id: package
              env:
                  VERSION: ${{ github.event.release.tag_name || github.ref_name }}
              run: |
                  # One asset: the build is not told which Kindle it is for.
                  name="karyll-$VERSION-kindle"
                  # The archive opens onto extensions and documents; device/assets
                  # and device/make-tile.sh stay out of it.
                  (cd device && zip -qr "$RUNNER_TEMP/$name.zip" extensions documents -x '*.DS_Store')
                  # The sidecar names the zip alone.
                  (cd "$RUNNER_TEMP" && sha256sum "$name.zip" > "$name.zip.sha256")
                  echo "name=$name" >> "$GITHUB_OUTPUT"
                  ls -lh "$RUNNER_TEMP/$name.zip"

            # `--clobber` replaces an asset of the same name.
            - name: Attach to the release
              if: github.event_name == 'release'
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.event.release.tag_name }}
                  NAME: ${{ steps.package.outputs.name }}
              run: |
                  gh release upload "$TAG" \
                    "$RUNNER_TEMP/$NAME.zip" \
                    "$RUNNER_TEMP/$NAME.zip.sha256" \
                    --clobber

            - name: Keep the tree from a manual run
              if: github.event_name != 'release'
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ steps.package.outputs.name }}
                  path: |
                      device/extensions
                      device/documents
