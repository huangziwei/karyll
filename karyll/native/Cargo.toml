[package]
name = "karyll-native"
description = "A Markdown writing app for jailbroken Kindles."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "karyll"
path = "src/main.rs"

[dependencies]
karyll-core = { path = "../core" }

# Every dependency here is pure Rust with no C build script. rust-lld
# cross-links the binary statically against musl.

# ab_glyph: TTF rasterizer. Outlines one glyph on demand; a 23.5 MB CJK face
# measures 24 MB resident.
ab_glyph = "0.2"

# x11rb: pure-Rust X11 client over the socket. No `allow-unsafe-code` feature:
# it pulls `as-raw-xcb-connection`, which links the system libxcb.
x11rb = { version = "0.13", default-features = false }

# libc: open/ioctl/mmap for evdev and the framebuffer.
libc = "0.2"

# anyhow: error context through the on-device run loop.
anyhow = "1"
